name: stress-replication

permissions:
  contents: write

on:
  push:
    paths:
      - "src/selector_limitation/stress_experiment.py"
      - "src/selector_limitation/market_experiment.py"
      - "src/selector_limitation/candidate_zoo.py"
      - "PHASE5_PROTOCOL.md"
      - "tests/test_stress_experiment.py"
      - ".github/workflows/stress-replication.yml"
  pull_request:
    paths:
      - "src/selector_limitation/stress_experiment.py"
      - "src/selector_limitation/market_experiment.py"
      - "src/selector_limitation/candidate_zoo.py"
      - "PHASE5_PROTOCOL.md"
      - "tests/test_stress_experiment.py"
      - ".github/workflows/stress-replication.yml"
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run period/universe stress
        run: |
          python -m selector_limitation.stress_experiment --search-seeds 100
          cat results/stress_selector_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: stress-replication-results
          path: |
            results/stress_ledger.csv
            results/stress_summary.csv
            results/failure_map.csv
            results/stress_selector_summary.csv
            results/bootstrap_period_stress.csv
            results/stress_run.json

      - name: Persist compact Phase 5 results
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/stress_summary.csv \
            results/failure_map.csv \
            results/stress_selector_summary.csv \
            results/bootstrap_period_stress.csv \
            results/stress_run.json
          if git diff --cached --quiet; then
            echo "Compact results already current"
          else
            git commit -m "Freeze Phase 5 stress results [skip ci]"
            git push
          fi
