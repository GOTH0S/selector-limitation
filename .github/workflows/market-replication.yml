name: market-replication

on:
  push:
    paths:
      - "src/selector_limitation/market_*.py"
      - "src/selector_limitation/candidate_zoo.py"
      - ".github/workflows/market-replication.yml"
  pull_request:
    paths:
      - "src/selector_limitation/market_*.py"
      - "src/selector_limitation/candidate_zoo.py"
      - ".github/workflows/market-replication.yml"
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run stale-market experiment
        run: |
          python -m selector_limitation.market_experiment --search-seeds 100
          cat results/market_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: market-replication-results
          path: |
            results/market_sweep.csv
            results/market_summary.csv
            results/market_ensemble.csv
            results/candidate_zoo.csv
